<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Experiment Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>AI Experiment Manager</h1>
    <button class="btn" id="new-btn">+ New Experiment</button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-search">
        <input type="text" id="search" placeholder="Search by name or tag…">
      </div>
      <div class="exp-list" id="exp-list">
        <div class="empty">Loading…</div>
      </div>
    </aside>

    <section class="detail" id="detail">
      <div class="empty-detail">Select an experiment to view details</div>
    </section>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
